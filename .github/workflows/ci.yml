name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Reject retired data paths and unsafe text
        run: |
          if git grep -n --fixed-strings "postgres_changes" -- app components lib; then
            exit 1
          fi
          if git grep -n --fixed-strings "?token=" -- app/api; then
            exit 1
          fi
          if git grep -n --fixed-strings "Nothing is sent to anyone" -- README.md app components data docs lib scripts tests; then
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
      - name: Build with dummy credentials
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          PUBLIC_ID_SECRET: ci-placeholder-public-id-secret
          XAI_API_KEY: ci-placeholder-xai-key
          PERSON_KEY_PEPPER: ci-placeholder-person-key-pepper
          CRON_SECRET: ci-placeholder-cron-secret
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3173
          MAX_MEMBERS_PER_EVENT: "200"
          AI_DAILY_CALL_LIMIT: "3000"
          AI_EVENT_DAILY_CALL_LIMIT: "400"
          JOIN_IP_LIMIT: "8"
          JOIN_EVENT_LIMIT: "400"
          EVENT_CREATE_IP_LIMIT: "5"
          EVENT_CREATE_GLOBAL_LIMIT: "200"
          IMPORT_LIMIT: "6"
          ASK_MINUTE_LIMIT: "5"
          ASK_HOUR_LIMIT: "20"
          AUTH_EXCHANGE_LIMIT: "10"
          EVENT_DELETE_LIMIT: "5"
          RETENTION_DAYS: "365"

  integration:
    name: Supabase local integration tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_HOME: ${{ github.workspace }}/.supabase-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
      - name: Start local Supabase
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            node scripts/print-sanitized-log.mjs "$RUNNER_TEMP/supabase-start.log"
            exit 1
          }
      - name: Verify migrations with a public-only search path and token upgrade compatibility
        id: migration-upgrade
        run: |
          set -o pipefail
          node scripts/test-token-migration-upgrade.mjs 2>&1 | tee "$RUNNER_TEMP/supabase-migration-test.log"
      - name: Print sanitized migration fixture log on failure
        if: failure() && steps.migration-upgrade.outcome == 'failure'
        run: node scripts/print-sanitized-log.mjs "$RUNNER_TEMP/supabase-migration-test.log"
      - name: Run Supabase integration tests
        id: integration-test
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/supabase-integration-test.log"
      - name: Print sanitized integration test log on failure
        if: failure() && steps.integration-test.outcome == 'failure'
        run: node scripts/print-sanitized-log.mjs "$RUNNER_TEMP/supabase-integration-test.log"
      - name: Upload local Supabase logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: supabase-integration-logs
          path: |
            ${{ runner.temp }}/supabase-migration-test.log
            ${{ runner.temp }}/supabase-integration-test.log
          if-no-files-found: ignore

  e2e:
    name: Playwright mock-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Playwright browsers outside the workspace
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/convene-playwright-browsers" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
